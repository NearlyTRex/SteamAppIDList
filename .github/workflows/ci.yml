name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  # Only pull requests: a newer push supersedes their run. On main every run
  # finishes, since each push's secret scan covers only that push's commits.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    uses: NearlyTRex/Workflows/.github/workflows/lint.yml@a312ddd3b1f067963e825ffbab2cae8f82f6dcb1 # v0.2.29
    permissions:
      contents: read

  # node --test runs Tests/integration/*.test.js through pytest-testrex, which
  # must reach every statement and branch of the script, and whose meta suite
  # runs eslint over both.
  test:
    name: Tests
    uses: NearlyTRex/Workflows/.github/workflows/python-ci.yml@a312ddd3b1f067963e825ffbab2cae8f82f6dcb1 # v0.2.29
    permissions:
      contents: read
    with:
      node-version: "24"
      coverage: false
      js-coverage-source: steamcmd_appid.js
      js-coverage-branch: true
