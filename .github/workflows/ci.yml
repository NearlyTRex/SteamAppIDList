name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  # Only pull requests: a newer push supersedes their run. On main every run
  # finishes, since each push's secret scan covers only that push's commits.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    uses: NearlyTRex/Workflows/.github/workflows/lint.yml@a1a89468956df5ae1713b94579fec1defc4360a1 # v0.2.16
    permissions:
      contents: read
