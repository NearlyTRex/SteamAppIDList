name: Generate Output

# Rebuilds the appid lists from Steam daily and opens a pull request when they change.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: generate-output
  cancel-in-progress: false

jobs:
  update:
    name: Update
    uses: NearlyTRex/Workflows/.github/workflows/scheduled-update.yml@a1a89468956df5ae1713b94579fec1defc4360a1 # v0.2.16
    permissions:
      contents: write
      pull-requests: write
    with:
      node-version: "24"
      command: npm ci && node steamcmd_appid.js
      paths: steamcmd_appid.json steamcmd_appid.csv steamcmd_appid.xml
      commit-message: "GitHub Actions build: {date}"
      assignees: NearlyTRex
      timeout-minutes: 30
