name: Generate Output

# Rebuilds the appid lists from Steam daily and commits them when they change.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: generate-output
  cancel-in-progress: false

jobs:
  update:
    name: Update
    uses: NearlyTRex/Workflows/.github/workflows/scheduled-update.yml@9672c4701131f14fa8e6f7db7e1d0742db0f5236 # v0.2.12
    permissions:
      contents: write
    with:
      node-version: "24"
      command: npm ci && node steamcmd_appid.js
      paths: steamcmd_appid.json steamcmd_appid.csv steamcmd_appid.xml
      commit-message: "GitHub Actions build: {date}"
      timeout-minutes: 30
