name: Update copyright year(s) in license file

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 1 *" # 03:00 AM on January 1

permissions: {}

jobs:
  license-year:
    name: License year
    uses: NearlyTRex/Workflows/.github/workflows/license-year.yml@4a7f6e3f7dbda5bbe67fd2f25d6f03373ea5f811 # v0.2.25
    permissions:
      contents: write
      pull-requests: write
    with:
      path: LICENSE.md
      assignees: NearlyTRex
