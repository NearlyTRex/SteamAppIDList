name: Update copyright year(s) in license file

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 1 *" # 03:00 AM on January 1

permissions: {}

jobs:
  license-year:
    name: License year
    uses: NearlyTRex/Workflows/.github/workflows/license-year.yml@a1a89468956df5ae1713b94579fec1defc4360a1 # v0.2.16
    permissions:
      contents: write
      pull-requests: write
    with:
      path: LICENSE.md
      assignees: NearlyTRex
